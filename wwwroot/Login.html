<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 設計: 6. 画面タイトル -->
    <title>ログイン | 勤怠管理システム</title>
    <!-- 打刻画面と同一のスタイルシート構成 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/kintai.css">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 480px;">

    <!-- ログインメインカード (SC-01) -->
    <div class="card shadow-sm border-0 mb-4">
        <!-- 設計: 6. 画面タイトル ヘッダー表示 -->
        <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 fw-bold">勤怠管理システムログイン</h5>
        </div>

        <div class="card-body p-4">

            <!-- 設計: 4. 業務エラーメッセージ (E-0005等の認証失敗エラーを赤文字枠で表示) -->
            <div id="alert-error" class="alert alert-danger d-none py-2 mb-3 text-start fs-7" role="alert"></div>

            <!-- ログインフォーム -->
            <form id="form-login" novalidate>

                <!-- 設計: 1. メールアドレス 入力項目 -->
                <div class="mb-3 text-start">
                    <label for="input-email" class="form-label fw-bold text-muted small mb-1">
                        メールアドレス <span class="badge bg-danger ms-1">必須</span>
                    </label>
                    <input 
                        type="email" 
                        class="form-control form-control-lg fs-6" 
                        id="input-email" 
                        name="email" 
                        placeholder="example@domain.com" 
                        autocomplete="email"
                    />
                    <!-- 設計: 5. 入力チェック (E-0001, E-0003 のバリデーションメッセージを項目の下に赤文字で表示) -->
                    <div id="error-email" class="text-danger small mt-1 d-none"></div>
                </div>

                <!-- 設計: 2. パスワード 入力項目 (8〜32桁、英数記号必須) -->
                <div class="mb-4 text-start">
                    <label for="input-password" class="form-label fw-bold text-muted small mb-1">
                        パスワード <span class="badge bg-danger ms-1">必須</span>
                    </label>
                    <input 
                        type="password" 
                        class="form-control form-control-lg fs-6" 
                        id="input-password" 
                        name="password" 
                        placeholder="8〜32桁の英数記号" 
                        autocomplete="current-password"
                    />
                    <!-- 設計: 5. 入力チェック (E-0001, E-0002, E-0004 のバリデーションメッセージを項目の下に赤文字で表示) -->
                    <div id="error-password" class="text-danger small mt-1 d-none"></div>
                </div>

                <!-- 設計: 3. ログインボタン (ログイン実行) -->
                <div class="mb-3">
                    <button 
                        type="submit" 
                        id="btn-login" 
                        class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm">
                        ログイン
                    </button>
                </div>
                <div class="text-center mb-3">
                    <span class="text-muted small">※パスワードをお忘れの場合は管理者へお問い合わせください。</span>
                </div>

                <hr class="my-4" />

                <!-- 設計: 5. 初回ログインリンク (SC-02 初回ログイン画面への遷移) -->
                <div class="text-center">
                    <a href="/firstlogin.html" id="link-first-login" class="text-decoration-none small text-primary fw-bold">
                        初回ログイン時はこちら
                    </a>
                </div>

            </form>

        </div>
    </div>

</div>

<!-- 入力検証・API送信・画面遷移用スクリプト -->
<script>
    // 設計: エラーコードに対応する文言定義辞書
    const ERROR_MESSAGES = {
        "E-0001_EMAIL": "メールアドレスを入力してください。入力内容をご確認のうえ、再度入力してください。",
        "E-0001_PASSWORD": "パスワードを入力してください。入力内容をご確認のうえ、再度入力してください。",
        "E-0002": "パスワードは指定された桁数で入力してください。入力内容をご確認のうえ、再度入力してください。",
        "E-0003": "メールアドレスは指定された文字種（英数字・記号等）で入力してください。入力内容をご確認のうえ、再度入力してください。",
        "E-0004": "パスワードは指定された形式（英大文字・小文字・数字を含む形式等）で入力してください。入力内容をご確認のうえ、再度入力してください。",
        "E-0005": "メールアドレスまたはパスワードに誤りがあります。正しく入力されているかご確認のうえ、再度お試しください。"
    };

    const formLogin = document.getElementById("form-login");
    const inputEmail = document.getElementById("input-email");
    const inputPassword = document.getElementById("input-password");
    const errorEmail = document.getElementById("error-email");
    const errorPassword = document.getElementById("error-password");
    const alertError = document.getElementById("alert-error");
    const btnLogin = document.getElementById("btn-login");

    formLogin.addEventListener("submit", async (e) => {
        e.preventDefault();

        // エラー表示の初期化
        errorEmail.classList.add("d-none");
        errorEmail.textContent = "";
        errorPassword.classList.add("d-none");
        errorPassword.textContent = "";
        alertError.classList.add("d-none");
        alertError.textContent = "";

        const email = inputEmail.value.trim();
        const password = inputPassword.value;
        let hasError = false;

        // 設計: 5. メールアドレス 入力チェック (E-0001 必須, E-0003 形式)
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
            errorEmail.textContent = ERROR_MESSAGES["E-0001_EMAIL"];
            errorEmail.classList.remove("d-none");
            hasError = true;
        } else if (!emailRegex.test(email)) {
            errorEmail.textContent = ERROR_MESSAGES["E-0003"];
            errorEmail.classList.remove("d-none");
            hasError = true;
        }

        // 設計: 5. パスワード 入力チェック (E-0001 必須, E-0002 桁数, E-0004 英数記号形式)
        const passwordComplexityRegex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[^\w\s]).+$/;
        if (!password) {
            errorPassword.textContent = ERROR_MESSAGES["E-0001_PASSWORD"];
            errorPassword.classList.remove("d-none");
            hasError = true;
        } else if (password.length < 8 || password.length > 32) {
            errorPassword.textContent = ERROR_MESSAGES["E-0002"];
            errorPassword.classList.remove("d-none");
            hasError = true;
        } else if (!passwordComplexityRegex.test(password)) {
            errorPassword.textContent = ERROR_MESSAGES["E-0004"];
            errorPassword.classList.remove("d-none");
            hasError = true;
        }

        if (hasError) return;

        // ボタンの多重送信防止
        btnLogin.disabled = true;

        try {
            // 設計: 5-2. 認証処理の呼び出し (LoginController へ POST)
            const response = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();

            // 設計: 3. 画面遷移 (ログイン成功判定)
            if (response.ok && result.isSuccess) {
                if (result.isFirstLogin) {
                    // 設計: 初回ログイン時は SC-02 へ遷移
                    window.location.href = "/firstlogin.html";
                } else {
                    // 設計: 通常ログイン成功時は SC-04 打刻画面へ遷移
                    window.location.href = "/timestamp.html";
                }
            } else {
                // 設計: 5-2. 認証エラー (E-0005) の赤文字表示
                const code = result.errorCode || "E-0005";
                alertError.textContent = ERROR_MESSAGES[code] || ERROR_MESSAGES["E-0005"];
                alertError.classList.remove("d-none");
            }
        } catch (err) {
            alertError.textContent = ERROR_MESSAGES["E-0005"];
            alertError.classList.remove("d-none");
        } finally {
            btnLogin.disabled = false;
        }
    });
</script>

</body>
</html>
